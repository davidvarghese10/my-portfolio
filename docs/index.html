
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Varghese - Creative Developer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Manrope:wght@200;300;400;500;600;700;800&family=Oswald:wght@400;500;700&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --neon-blue: #00f3ff;
      }
      
      /* Custom cursor exclusively for pointer-enabled desktop devices */
      @media (hover: hover) and (pointer: fine) {
        html, body, *, a, button, input, textarea, .hover-target {
          cursor: none !important;
        }
      }

      body {
        font-family: 'Manrope', sans-serif;
        background-color: #050505; /* Deep Black */
        color: #ffffff;
        overflow-x: hidden;
      }

      .font-oswald {
        font-family: 'Oswald', sans-serif;
      }
      .font-poppins {
        font-family: 'Poppins', sans-serif;
      }
      ::selection {
        background-color: rgba(0, 243, 255, 0.3);
        color: #fff;
      }
      
      /* Apple-style Liquid Glass Text Effect */
      .liquid-glass-text {
        color: rgba(255, 255, 255, 0.1); /* Transparent base */
        background: linear-gradient(
          135deg, 
          rgba(255,255,255,0.9) 0%, 
          rgba(255,255,255,0.4) 25%, 
          #00f3ff 50%, 
          rgba(255,255,255,0.4) 75%, 
          rgba(255,255,255,0.9) 100%
        );
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        
        /* Soft inner glow simulation */
        filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.3));
        
        animation: glass-shine 4s ease-in-out infinite;
      }
      
      @keyframes glass-shine {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Water Droplet Cursor - High Transparency */
      .glass-cursor {
        background: transparent;
        
        /* Remove blur to make text readable, add brightness for lens effect */
        backdrop-filter: brightness(1.2);
        -webkit-backdrop-filter: brightness(1.2);
        
        /* Delicate reflections only - no dark shadows */
        box-shadow: 
          /* Subtle white highlight top-left */
          inset 2px 2px 5px rgba(255, 255, 255, 0.4),
          /* Very faint rim light */
          inset -1px -1px 3px rgba(255, 255, 255, 0.2),
          /* Faint outer glow */
          0 0 5px rgba(255, 255, 255, 0.1);
          
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
      }

      /* Liquid Glass Button for AI Chat */
      .liquid-glass-button {
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 
          inset 0 0 12px rgba(255, 255, 255, 0.05),
          0 8px 32px rgba(0, 0, 0, 0.4);
        color: #00f3ff;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .liquid-glass-button:hover {
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 
          inset 0 0 20px rgba(255, 255, 255, 0.1),
          0 0 25px rgba(0, 243, 255, 0.4);
        border-color: rgba(0, 243, 255, 0.4);
        color: #fff;
      }

      /* SVG Filter Utility */
      .liquid-hover {
        /* Ensure GPU acceleration for smoothness */
        transform: translateZ(0);
        will-change: filter;
      }
      
      .liquid-hover:hover {
        filter: url(#liquid-distortion);
      }
    </style>
  <script type="module" crossorigin src="./assets/index-BmiXQRNO.js"></script>
</head>
  <body>
    <div id="root"></div>

    <!-- Global SVG Filters -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
      <defs>
        <!-- 
          Optimized for minimal distortion ("crushing") while keeping fluid motion.
          Low baseFrequency = larger waves. Scale = 1 for gentle displacement.
        -->
        <filter id="liquid-distortion" x="-50%" y="-50%" width="200%" height="200%">
          <feTurbulence type="fractalNoise" baseFrequency="0.002" numOctaves="1" result="noise" seed="1">
             <animate attributeName="baseFrequency" dur="12s" values="0.002;0.003;0.002" repeatCount="indefinite" />
          </feTurbulence>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
  </body>
</html>
