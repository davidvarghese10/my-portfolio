    <style>
      :root {
        --neon-blue: #00f3ff;
      }
      
      /* Custom cursor exclusively for pointer-enabled desktop device */
      @media (hover: hover) and (pointer: fine) {
        html, body, *, a, button, input, textarea, .hover-target {
          cursor: none !important;
        }
      }

      body {
        font-family: 'Manrope', sans-serif;
        background-color: #050505; /* Deep Black */
        color: #ffffff;
        overflow-x: hidden;
      }

      .font-oswald {
        font-family: 'Oswald', sans-serif;
      }
      .font-poppins {
        font-family: 'Poppins', sans-serif;
      }
      ::selection {
        background-color: rgba(0, 243, 255, 0.3);
        color: #fff;
      }

      /* Completely eliminate black tap highlight boxes & focus outlines on mobile devices */
      *, *::before, *::after {
        -webkit-tap-highlight-color: transparent !important;
      }

      button, a, input, textarea, select, [role="button"] {
        -webkit-tap-highlight-color: transparent !important;
        outline: none !important;
      }

      button:focus, button:active, button:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      
      /* Apple-style Liquid Glass Text Effect (GPU-optimized: diagonal blue light animation without heavy drop-shadow filter) */
      .liquid-glass-text {
        color: rgba(255, 255, 255, 0.1);
        background: linear-gradient(
          135deg, 
          rgba(255,255,255,0.92) 0%, 
          rgba(255,255,255,0.42) 25%, 
          #00f3ff 50%, 
          rgba(255,255,255,0.42) 75%, 
          rgba(255,255,255,0.92) 100%
        );
        background-size: 200% 200%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: glass-shine 4s ease-in-out infinite;
      }

      @keyframes glass-shine {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Water Droplet Cursor - Ultra-Clear Liquid Glass */
      .glass-cursor {
        background: transparent;
        border: 1px solid rgba(0, 243, 255, 0.45);
        box-shadow: 
          inset 1px 1px 1.5px rgba(255, 255, 255, 0.7),
          0 0 4px rgba(0, 243, 255, 0.25);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        will-change: transform;
      }

      /* Darker Blue Liquid Glass Cursor for Light Backgrounds (404 Page) */
      .glass-cursor-dark {
        background: rgba(2, 102, 200, 0.14);
        border: 1.5px solid rgba(3, 105, 161, 0.88);
        box-shadow: 
          inset 1px 1px 1.5px rgba(255, 255, 255, 0.85),
          inset -1px -1px 2px rgba(3, 105, 161, 0.35),
          0 2px 6px rgba(2, 102, 200, 0.35);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        will-change: transform;
      }

      /* Liquid Glass Button for AI Chat */
      .liquid-glass-button {
        background: rgba(8, 12, 18, 0.78);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 
          inset 0 0 10px rgba(255, 255, 255, 0.04),
          0 6px 20px rgba(0, 0, 0, 0.4);
        color: #00f3ff;
        transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
      }

      .liquid-glass-button:hover {
        background: rgba(14, 22, 32, 0.88);
        box-shadow: 
          inset 0 0 14px rgba(255, 255, 255, 0.08),
          0 0 18px rgba(0, 243, 255, 0.35);
        border-color: rgba(0, 243, 255, 0.4);
        color: #fff;
      }

      .liquid-hover {
        transform: translateZ(0);
      }
    </style>
