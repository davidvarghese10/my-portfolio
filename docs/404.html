<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found - David Varghese</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var validTabs = [
          'home',
          'profile',
          'experience',
          'education',
          'projects',
          'work',
          'achievements',
          'certificates',
          'contact'
        ];
        var segments = window.location.pathname.split('/').filter(Boolean);
        var repoFolders = ['my-portfolio', 'portfolio'];
        var basePath = '/';
        var routeSegments = segments.slice();

        if (
          routeSegments.length > 0 &&
          repoFolders.indexOf(routeSegments[0].toLowerCase()) !== -1
        ) {
          basePath = '/' + routeSegments[0] + '/';
          routeSegments = routeSegments.slice(1);
        }

        if (routeSegments.length === 1) {
          var page = routeSegments[0].toLowerCase();
          if (validTabs.indexOf(page) !== -1) {
            var targetTab = page === 'work' ? 'projects' : page;
            window.location.replace(
              basePath + (targetTab === 'home' ? '' : '?page=' + targetTab)
            );
          }
        }
      })();
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #fff;
        color: #333333;
        font-family: 'Arvo', serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .page_404 {
        padding: 40px 16px;
        background: #fff;
        font-family: 'Arvo', serif;
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
        text-align: center;
      }

      .four_zero_four_bg {
        background-image: url('/dribbble_1.gif'),
          url('./dribbble_1.gif');
        height: 400px;
        background-position: center;
        background-repeat: no-repeat;
      }

      .four_zero_four_bg h1 {
        font-size: 80px;
        line-height: 1;
        font-weight: 400;
        text-align: center;
        color: #333333;
      }

      .contant_box_404 {
        margin-top: -50px;
      }

      .contant_box_404 h3 {
        font-size: 30px;
        font-weight: 400;
        color: #333333;
        margin-bottom: 8px;
      }

      .contant_box_404 p {
        font-size: 16px;
        color: #333333;
        margin-bottom: 20px;
      }

      .link_404 {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 14px 36px;
        margin: 12px 0;
        border-radius: 9999px;
        overflow: hidden;
        background: #080a0f;
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        text-decoration: none;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .link_404::before {
        content: '';
        position: absolute;
        inset: 0;
        background: #00f3ff;
        transform-origin: right;
        transform: scaleX(0);
        transition: transform 0.5s ease-out;
      }

      .link_404:hover {
        border-color: rgba(0, 243, 255, 0.4);
      }

      .link_404:hover::before {
        transform-origin: left;
        transform: scaleX(1);
      }

      .link_404 span {
        position: relative;
        z-index: 10;
        font-family: 'Poppins', sans-serif;
        font-size: 22px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.025em;
        color: #e5e5e5;
        transition: color 0.3s ease;
      }

      .link_404 svg {
        position: relative;
        z-index: 10;
        width: 24px;
        height: 24px;
        color: #a3a3a3;
        flex-shrink: 0;
        transition: color 0.3s ease;
      }

      .link_404:hover span,
      .link_404:hover svg {
        color: #000000;
      }
    </style>
  </head>
  <body>
    <section class="page_404">
      <div class="four_zero_four_bg">
        <h1>404</h1>
      </div>
      <div class="contant_box_404">
        <h3>Look like you're lost</h3>
        <p>the page you are looking for not avaible!</p>
        <a href="/" class="link_404" id="home-link">
          <span>Go to Home</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 18 L15.2 8.8" />
            <path d="M18 6 L9 6" />
            <path d="M18 10 L18 16" />
          </svg>
        </a>
      </div>
    </section>
    <script>
      (function () {
        var preload = new Image();
        preload.src = '/dribbble_connected.gif';

        var segments = window.location.pathname.split('/').filter(Boolean);
        var repoFolders = ['my-portfolio', 'portfolio'];
        var targetHref = '/';
        if (
          segments.length > 0 &&
          repoFolders.indexOf(segments[0].toLowerCase()) !== -1
        ) {
          targetHref = '/' + segments[0] + '/';
        }

        var link = document.getElementById('home-link');
        var bg = document.querySelector('.four_zero_four_bg');
        var connecting = false;

        if (link) {
          link.setAttribute('href', targetHref);
          link.addEventListener('click', function (e) {
            e.preventDefault();
            if (connecting) return;
            connecting = true;
            if (bg) {
              bg.style.backgroundImage =
                "url('/dribbble_connected.gif?t=" +
                Date.now() +
                "'), url('/dribbble_connected.gif'), url('./dribbble_connected.gif')";
            }
            setTimeout(function () {
              window.location.href = targetHref;
            }, 1500);
          });
        }
      })();
    </script>
  </body>
</html>
